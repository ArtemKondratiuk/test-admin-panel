services:
  php-fpm:
    build:
      context: ./docker/php-fpm
    container_name: 'test-php-fpm'
    depends_on:
      - mysql
      - redis
    networks:
      - symfony_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/app
      - ./docker/php-fpm/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini

  nginx:
    image: nginx
    container_name: 'test-nginx'
    ports:
      - '80:80'
    depends_on:
      - php-fpm
    networks:
      - symfony_net
    volumes:
      - ./:/var/www/app
      - ./docker/nginx/config/default.conf:/etc/nginx/conf.d/default.conf

  mysql:
    image: mysql:8.0
    container_name: 'test-database'
    networks:
      - symfony_net
    volumes:
      - mysql:/var/lib/mysql
    command: "--default-authentication-plugin=mysql_native_password"
    restart: always
    environment:
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}"
      - "MYSQL_DATABASE=${MYSQL_DATABASE}"
      - "MYSQL_USER=${MYSQL_USER}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD}"
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: 'test-redis'
    networks:
      - symfony_net
    restart: always
    ports:
      - "6379:6379"

  messenger-worker:
    build:
      context: ./docker/php-fpm
    container_name: 'test-messenger-worker'
    networks:
      - symfony_net
    restart: always
    depends_on:
      - mysql
      - redis
      - php-fpm
    volumes:
      - ./:/var/www/app
    command: php bin/console messenger:consume async -vv --limit=100

volumes:
  mysql:

networks:
  symfony_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.2

